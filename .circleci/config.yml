version: 2
jobs:
  build:
    working_directory: ~/wayback-diff
    docker:
      - image: cimg/node:22.22
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-2-{{ checksum "package-lock.json" }}
      - run:
          name: Dependencies
          command: npm ci
      - save_cache:
          key: dependency-cache-2-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
      - run:
          name: Build
          command: npm run build
      - run:
          # Note that eslint run before every test run due to `pretest` in
          # `package.json`.
          name: Test
          command: CI=true npm test

workflows:
  version: 2
  build:
    jobs:
      - build
